<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行分帳小幫手</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f3ef;
  color: #444;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 22px 16px 50px;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 8px 0 5px;
  font-weight: 700;
}

.subtitle {
  text-align: center;
  color: #999;
  font-size: 13px;
  margin-bottom: 22px;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.045);
}

.card-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 13px;
  color: #888;
  margin-bottom: 6px;
}

input,
select,
button {
  font-family: inherit;
}

input,
select {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 11px;
  padding: 12px;
  font-size: 15px;
  background: #fafafa;
  color: #444;
  outline: none;
}

input:focus,
select:focus {
  border-color: #aaa;
  background: #fff;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.full {
  grid-column: 1 / -1;
}

.currency-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.currency-btn {
  border: 1px solid #ddd;
  background: #fafafa;
  color: #666;
  border-radius: 11px;
  padding: 11px;
  cursor: pointer;
  font-size: 14px;
}

.currency-btn.selected {
  background: #555;
  color: #fff;
  border-color: #555;
}

.people {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.person {
  border: 1px solid #ddd;
  background: #fafafa;
  border-radius: 11px;
  padding: 11px 4px;
  text-align: center;
  cursor: pointer;
  font-size: 13px;
  user-select: none;
  transition: .15s;
}

.person.selected {
  background: #555;
  color: #fff;
  border-color: #555;
}

.add-btn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  background: #555;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 15px;
}

.add-btn:active {
  transform: scale(.98);
}

.rate-box {
  background: #f7f5f1;
  border-radius: 12px;
  padding: 13px;
  margin-top: 12px;
  font-size: 13px;
  color: #777;
}

.rate-box input {
  margin-top: 7px;
  background: white;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.person-summary {
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 14px;
  background: #fcfcfc;
}

.person-name {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 8px;
}

.money-line {
  font-size: 13px;
  color: #777;
  margin: 3px 0;
  line-height: 1.5;
}

.balance-positive {
  color: #55755d;
  font-weight: 700;
}

.balance-negative {
  color: #9a5e5e;
  font-weight: 700;
}

.balance-zero {
  color: #888;
  font-weight: 700;
}

.total-box {
  background: #f7f5f1;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  margin-bottom: 12px;
}

.total-main {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}

.total-sub {
  color: #888;
  font-size: 14px;
}

.expense {
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  background: #fff;
}

.expense-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.expense-name {
  font-size: 16px;
  font-weight: 700;
}

.expense-category {
  display: inline-block;
  font-size: 11px;
  color: #888;
  background: #f1efeb;
  padding: 3px 7px;
  border-radius: 6px;
  margin-left: 5px;
}

.expense-money {
  text-align: right;
  white-space: nowrap;
}

.krw {
  font-size: 14px;
  font-weight: 700;
}

.twd {
  font-size: 13px;
  color: #999;
  margin-top: 3px;
}

.expense-info {
  color: #888;
  font-size: 12px;
  line-height: 1.8;
  margin-top: 8px;
}

.delete-btn {
  border: 0;
  background: #f3f1ee;
  color: #888;
  border-radius: 8px;
  padding: 7px 10px;
  margin-top: 9px;
  cursor: pointer;
}

.settlement {
  background: #f7f5f1;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 9px;
}

.settlement-text {
  font-size: 15px;
  line-height: 1.7;
}

.settlement-amount {
  font-weight: 700;
}

.currency-title {
  font-size: 14px;
  font-weight: 700;
  color: #666;
  margin: 14px 0 8px;
}

.currency-title:first-child {
  margin-top: 0;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 28px 10px;
  font-size: 14px;
}

.clear-btn {
  width: 100%;
  border: 1px solid #ddd;
  background: white;
  color: #999;
  border-radius: 11px;
  padding: 11px;
  cursor: pointer;
  margin-top: 5px;
}

.note {
  font-size: 11px;
  color: #aaa;
  text-align: center;
  margin-top: 20px;
  line-height: 1.7;
}

@media (max-width: 520px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .summary {
    grid-template-columns: 1fr;
  }

  .people {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="container">

<h1>旅行分帳小幫手</h1>
<div class="subtitle">四個人的旅費，讓我幫你算清楚 ♡</div>


<!-- 匯率 -->
<div class="card">

  <div class="card-title">💱 匯率設定</div>

  <label>1,000 韓元 = 台幣</label>

  <div class="rate-box">

    <strong>
      NT$
      <span id="rateText">23</span>
    </strong>

    <input
      id="rateInput"
      type="number"
      value="23"
      min="0"
      step="0.01"
      oninput="updateRate()"
    >

  </div>

</div>


<!-- 新增支出 -->
<div class="card">

<div class="card-title">➕ 新增一筆支出</div>

<div class="grid">


<div class="full">

<label>吃了什麼／買了什麼</label>

<input
id="expenseName"
type="text"
placeholder="例如：韓牛、咖啡、交通"
>

</div>


<div>

<label>分類</label>

<select id="category">

<option>🍜 餐飲</option>
<option>☕ 咖啡</option>
<option>🚕 交通</option>
<option>🏨 住宿</option>
<option>🛍️ 購物</option>
<option>🎫 門票</option>
<option>📦 其他</option>

</select>

</div>


<div>

<label>金額</label>

<input
id="amount"
type="number"
placeholder="輸入金額"
min="0"
>

</div>


<!-- 幣別 -->

<div class="full">

<label>這筆是哪一種幣別？</label>

<div class="currency-buttons">

<button
type="button"
id="krwBtn"
class="currency-btn selected"
onclick="selectCurrency('KRW')"
>
🇰🇷 韓元 KRW
</button>

<button
type="button"
id="twdBtn"
class="currency-btn"
onclick="selectCurrency('TWD')"
>
🇹🇼 台幣 TWD
</button>

</div>

</div>


<!-- 誰先付 -->

<div class="full">

<label>誰先付？</label>

<select id="payer">

<option>羊咩</option>
<option>ㄚ霆</option>
<option>多比</option>
<option>艾薇</option>

</select>

</div>


<!-- 誰分攤 -->

<div class="full">

<label>誰分擔？</label>

<div class="people">

<div
class="person selected"
data-person="羊咩"
onclick="togglePerson(this)"
>
羊咩
</div>

<div
class="person selected"
data-person="ㄚ霆"
onclick="togglePerson(this)"
>
ㄚ霆
</div>

<div
class="person selected"
data-person="多比"
onclick="togglePerson(this)"
>
多比
</div>

<div
class="person selected"
data-person="艾薇"
onclick="togglePerson(this)"
>
艾薇
</div>

</div>

</div>


</div>


<button
class="add-btn"
onclick="addExpense()"
>
＋ 加入這筆支出
</button>

</div>


<!-- 總支出 -->

<div class="card">

<div class="card-title">💰 目前總支出</div>

<div class="total-box">

<div
class="total-main"
id="totalKRW"
>
₩0
</div>

<div
class="total-sub"
id="totalTWD"
>
NT$0
</div>

</div>

<div id="expenseList">

<div class="empty">
還沒有任何消費紀錄
</div>

</div>

</div>


<!-- 每人結算 -->

<div class="card">

<div class="card-title">
📊 四人結算
</div>

<div
id="summary"
class="summary"
></div>

</div>


<!-- 最後給錢 -->

<div class="card">

<div class="card-title">
💸 最後怎麼給錢
</div>

<div id="settlement"></div>

</div>


<button
class="clear-btn"
onclick="clearAll()"
>
清除全部紀錄
</button>


<div class="note">
資料會自動儲存在這台裝置的瀏覽器中。<br>
換手機或換瀏覽器不會自動同步。
</div>


</div>


<script>

const people = [
  "羊咩",
  "ㄚ霆",
  "多比",
  "艾薇"
];

let rate =
Number(localStorage.getItem("travelRate")) || 23;

let currency = "KRW";

let expenses =
JSON.parse(
  localStorage.getItem("travelExpenses")
) || [];


/* =========================
   幣別
========================= */

function selectCurrency(type) {

  currency = type;

  document
    .getElementById("krwBtn")
    .classList.toggle(
      "selected",
      type === "KRW"
    );

  document
    .getElementById("twdBtn")
    .classList.toggle(
      "selected",
      type === "TWD"
    );
}


/* =========================
   匯率
========================= */

function updateRate() {

  rate =
    Number(
      document.getElementById("rateInput").value
    ) || 0;

  document.getElementById("rateText")
    .innerText =
    rate.toLocaleString(
      undefined,
      {
        maximumFractionDigits: 2
      }
    );

  localStorage.setItem(
    "travelRate",
    rate
  );

  render();
}


/* =========================
   分攤人
========================= */

function togglePerson(element) {

  element.classList.toggle(
    "selected"
  );
}


/* =========================
   新增支出
========================= */

function addExpense() {

  const name =
    document
      .getElementById("expenseName")
      .value
      .trim();

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const category =
    document.getElementById("category").value;

  const payer =
    document.getElementById("payer").value;

  const selected =
    [
      ...document.querySelectorAll(
        ".person.selected"
      )
    ].map(
      el => el.dataset.person
    );


  if (!name) {

    alert(
      "請輸入這筆支出是什麼！"
    );

    return;
  }


  if (!amount || amount <= 0) {

    alert(
      "請輸入正確的金額！"
    );

    return;
  }


  if (selected.length === 0) {

    alert(
      "至少要選一位分攤的人！"
    );

    return;
  }


  expenses.push({

    id: Date.now(),

    name: name,

    amount: amount,

    currency: currency,

    category: category,

    payer: payer,

    participants: selected

  });


  save();


  document
    .getElementById("expenseName")
    .value = "";


  document
    .getElementById("amount")
    .value = "";


  render();
}


/* =========================
   韓元換台幣
   只用於「同時顯示」
   不用於跨幣別結算
========================= */

function krwToTWD(amount) {

  return amount * rate / 1000;

}


/* =========================
   台幣換韓元
   只用於「同時顯示」
   不用於跨幣別結算
========================= */

function twdToKRW(amount) {

  if (!rate) return 0;

  return amount * 1000 / rate;

}


/* =========================
   儲存
========================= */

function save() {

  localStorage.setItem(
    "travelExpenses",
    JSON.stringify(expenses)
  );

}


/* =========================
   格式
========================= */

function formatKRW(value) {

  return "₩" +
    Math.round(value)
      .toLocaleString();

}


function formatTWD(value) {

  return "NT$" +
    Math.round(value)
      .toLocaleString();

}


/* =========================
   顯示支出
========================= */

function renderExpenses() {

  const list =
    document.getElementById(
      "expenseList"
    );


  if (expenses.length === 0) {

    list.innerHTML =
      '<div class="empty">還沒有任何消費紀錄</div>';

    return;

  }


  list.innerHTML = "";


  expenses
    .slice()
    .reverse()
    .forEach(expense => {

      const div =
        document.createElement("div");


      div.className =
        "expense";


      let originalMoney = "";

      let convertedMoney = "";


      if (expense.currency === "KRW") {

        originalMoney =
          formatKRW(expense.amount);

        convertedMoney =
          formatTWD(
            krwToTWD(expense.amount)
          );

      } else {

        originalMoney =
          formatTWD(expense.amount);

        convertedMoney =
          formatKRW(
            twdToKRW(expense.amount)
          );

      }


      const share =
        expense.amount /
        expense.participants.length;


      let shareText = "";


      if (expense.currency === "KRW") {

        shareText =
          formatKRW(share) +
          " ／ " +
          formatTWD(
            krwToTWD(share)
          );

      } else {

        shareText =
          formatTWD(share) +
          " ／ " +
          formatKRW(
            twdToKRW(share)
          );

      }


      div.innerHTML = `

        <div class="expense-top">

          <div>

            <div class="expense-name">

              ${escapeHTML(expense.name)}

              <span class="expense-category">
                ${escapeHTML(expense.category)}
              </span>

            </div>

          </div>


          <div class="expense-money">

            <div class="krw">
              ${originalMoney}
            </div>

            <div class="twd">
              ${convertedMoney}
            </div>

          </div>

        </div>


        <div class="expense-info">

          原始金額：
          ${originalMoney}

          <br>

          先付：
          ${escapeHTML(expense.payer)}

          <br>

          分攤：
          ${escapeHTML(
            expense.participants.join("、")
          )}

          <br>

          每人：
          ${shareText}

        </div>


        <button
          class="delete-btn"
          onclick="deleteExpense(${expense.id})"
        >
          刪除
        </button>

      `;


      list.appendChild(div);

    });

}


/* =========================
   刪除
========================= */

function deleteExpense(id) {

  expenses =
    expenses.filter(
      expense =>
        expense.id !== id
    );

  save();

  render();

}


/* =========================
   分幣別計算
========================= */

function calculateBalancesByCurrency(currencyType) {

  const data = {};


  people.forEach(person => {

    data[person] = {

      paid: 0,

      owed: 0,

      balance: 0

    };

  });


  expenses
    .filter(
      expense =>
        expense.currency === currencyType
    )
    .forEach(expense => {

      data[expense.payer].paid +=
        expense.amount;


      const share =
        expense.amount /
        expense.participants.length;


      expense.participants.forEach(
        person => {

          data[person].owed +=
            share;

        }
      );

    });


  people.forEach(person => {

    data[person].balance =
      data[person].paid -
      data[person].owed;

  });


  return data;

}


/* =========================
   每人結算
   韓元／台幣完全分開
========================= */

function renderSummary() {

  const summary =
    document.getElementById(
      "summary"
    );


  const krwData =
    calculateBalancesByCurrency("KRW");


  const twdData =
    calculateBalancesByCurrency("TWD");


  summary.innerHTML = "";


  people.forEach(person => {

    const k =
      krwData[person];


    const t =
      twdData[person];


    let krwBalance = "";


    let twdBalance = "";


    if (k.balance > 0.5) {

      krwBalance =
        `<div class="money-line balance-positive">
          🇰🇷 應收 ${formatKRW(k.balance)}
        </div>`;

    } else if (k.balance < -0.5) {

      krwBalance =
        `<div class="money-line balance-negative">
          🇰🇷 應付 ${formatKRW(Math.abs(k.balance))}
        </div>`;

    } else {

      krwBalance =
        `<div class="money-line balance-zero">
          🇰🇷 剛好
        </div>`;

    }


    if (t.balance > 0.5) {

      twdBalance =
        `<div class="money-line balance-positive">
          🇹🇼 應收 ${formatTWD(t.balance)}
        </div>`;

    } else if (t.balance < -0.5) {

      twdBalance =
        `<div class="money-line balance-negative">
          🇹🇼 應付 ${formatTWD(Math.abs(t.balance))}
        </div>`;

    } else {

      twdBalance =
        `<div class="money-line balance-zero">
          🇹🇼 剛好
        </div>`;

    }


    const div =
      document.createElement("div");


    div.className =
      "person-summary";


    div.innerHTML = `

      <div class="person-name">
        ${person}
      </div>


      <div class="money-line">

        🇰🇷 先付：
        ${formatKRW(k.paid)}

      </div>


      <div class="money-line">

        🇰🇷 應付：
        ${formatKRW(k.owed)}

      </div>


      ${krwBalance}


      <div style="height:8px;"></div>


      <div class="money-line">

        🇹🇼 先付：
        ${formatTWD(t.paid)}

      </div>


      <div class="money-line">

        🇹🇼 應付：
        ${formatTWD(t.owed)}

      </div>


      ${twdBalance}

    `;


    summary.appendChild(div);

  });

}


/* =========================
   單一幣別結算
========================= */

function calculateSettlementByCurrency(currencyType) {

  const data =
    calculateBalancesByCurrency(
      currencyType
    );


  let creditors = [];

  let debtors = [];


  people.forEach(person => {

    const balance =
      data[person].balance;


    if (balance > 0.5) {

      creditors.push({

        person: person,

        amount: balance

      });

    }


    else if (balance < -0.5) {

      debtors.push({

        person: person,

        amount:
          Math.abs(balance)

      });

    }

  });


  let result = [];


  let i = 0;

  let j = 0;


  while (
    i < debtors.length &&
    j < creditors.length
  ) {

    const debtor =
      debtors[i];


    const creditor =
      creditors[j];


    const amount =
      Math.min(
        debtor.amount,
        creditor.amount
      );


    if (amount > 0.01) {

      result.push({

        from:
          debtor.person,

        to:
          creditor.person,

        amount:
          amount,

        currency:
          currencyType

      });

    }


    debtor.amount -= amount;

    creditor.amount -= amount;


    if (debtor.amount < 0.01) {

      i++;

    }


    if (creditor.amount < 0.01) {

      j++;

    }

  }


  return result;

}


/* =========================
   最後怎麼給錢
========================= */

function renderSettlement() {

  const box =
    document.getElementById(
      "settlement"
    );


  if (expenses.length === 0) {

    box.innerHTML =
      '<div class="empty">新增支出後，這裡會自動算出誰要給誰。</div>';

    return;

  }


  const krwResult =
    calculateSettlementByCurrency(
      "KRW"
    );


  const twdResult =
    calculateSettlementByCurrency(
      "TWD"
    );


  box.innerHTML = "";


  /* 韓元 */

  const krwTitle =
    document.createElement("div");

  krwTitle.className =
    "currency-title";

  krwTitle.innerText =
    "🇰🇷 韓元結算";

  box.appendChild(krwTitle);


  if (krwResult.length === 0) {

    const div =
      document.createElement("div");

    div.className =
      "settlement";


    div.innerHTML = `

      <div class="settlement-text">
        🇰🇷 韓元目前不用互相給錢
      </div>

    `;


    box.appendChild(div);

  } else {

    krwResult.forEach(item => {

      const div =
        document.createElement("div");


      div.className =
        "settlement";


      div.innerHTML = `

        <div class="settlement-text">

          <strong>
            ${item.from}
          </strong>

          →

          <strong>
            ${item.to}
          </strong>

          <br>

          <span class="settlement-amount">

            ${formatKRW(item.amount)}

          </span>

        </div>

      `;


      box.appendChild(div);

    });

  }


  /* 台幣 */

  const twdTitle =
    document.createElement("div");

  twdTitle.className =
    "currency-title";

  twdTitle.innerText =
    "🇹🇼 台幣結算";

  box.appendChild(twdTitle);


  if (twdResult.length === 0) {

    const div =
      document.createElement("div");

    div.className =
      "settlement";


    div.innerHTML = `

      <div class="settlement-text">
        🇹🇼 台幣目前不用互相給錢
      </div>

    `;


    box.appendChild(div);

  } else {

    twdResult.forEach(item => {

      const div =
        document.createElement("div");


      div.className =
        "settlement";


      div.innerHTML = `

        <div class="settlement-text">

          <strong>
            ${item.from}
          </strong>

          →

          <strong>
            ${item.to}
          </strong>

          <br>

          <span class="settlement-amount">

            ${formatTWD(item.amount)}

          </span>

        </div>

      `;


      box.appendChild(div);

    });

  }

}


/* =========================
   總支出
   兩種幣別各自顯示
========================= */

function renderTotal() {

  let totalKRW = 0;

  let totalTWD = 0;


  expenses.forEach(expense => {

    if (expense.currency === "KRW") {

      totalKRW += expense.amount;

    } else {

      totalTWD += expense.amount;

    }

  });


  document.getElementById(
    "totalKRW"
  ).innerText =
    formatKRW(totalKRW);


  document.getElementById(
    "totalTWD"
  ).innerText =
    formatTWD(totalTWD);


}


/* =========================
   全部更新
========================= */

function render() {

  document.getElementById(
    "rateText"
  ).innerText =
    rate.toLocaleString(
      undefined,
      {
        maximumFractionDigits: 2
      }
    );


  document.getElementById(
    "rateInput"
  ).value = rate;


  renderExpenses();

  renderTotal();

  renderSummary();

  renderSettlement();

}


/* =========================
   清除
========================= */

function clearAll() {

  if (expenses.length === 0) {

    return;

  }


  if (
    !confirm(
      "確定要刪除全部旅行支出紀錄嗎？"
    )
  ) {

    return;

  }


  expenses = [];

  save();

  render();

}


/* =========================
   防止 HTML
========================= */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent = text;


  return div.innerHTML;

}


/* =========================
   啟動
========================= */

render();

</script>

</body>
</html>
